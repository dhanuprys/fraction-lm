<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <!-- Pizza Crust Gradient -->
    <radialGradient id="plainCrust" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#f59e0b"/>
      <stop offset="88%" stop-color="#d97706"/>
      <stop offset="96%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <!-- Melted Cheese Layer 1 -->
    <radialGradient id="plainCheese1" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>

    <!-- Melted Cheese Layer 2 -->
    <radialGradient id="plainCheese2" cx="48%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#fde047"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>

    <!-- Pepperoni Gradient -->
    <radialGradient id="plainPep" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="65%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <!-- Mushroom Gradient -->
    <linearGradient id="plainMush" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="plainPizzaShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Background Card -->
  <rect width="700" height="360" fill="#f8fafc" rx="20"/>

  <!-- ==================== PIZZA 1 (LEFT) ==================== -->
  <!-- Note: Intentionally UNMARKED with NO cut lines as required by the source! -->
  <g transform="translate(185, 180)" filter="url(#plainPizzaShadow)">
    <!-- Outer Crust -->
    <circle cx="0" cy="0" r="140" fill="url(#plainCrust)"/>
    <circle cx="0" cy="0" r="134" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="10,8" opacity="0.6"/>
    <!-- Cheese Surface -->
    <circle cx="0" cy="0" r="122" fill="url(#plainCheese1)"/>

    <!-- Assorted Toppings -->
    <!-- Pepperoni -->
    <circle cx="-48" cy="-52" r="20" fill="url(#plainPep)"/>
    <circle cx="55" cy="-40" r="20" fill="url(#plainPep)"/>
    <circle cx="-58" cy="40" r="20" fill="url(#plainPep)"/>
    <circle cx="48" cy="52" r="20" fill="url(#plainPep)"/>
    <circle cx="0" cy="-75" r="19" fill="url(#plainPep)"/>
    <circle cx="0" cy="75" r="19" fill="url(#plainPep)"/>
    <circle cx="-75" cy="0" r="19" fill="url(#plainPep)"/>
    <circle cx="75" cy="0" r="19" fill="url(#plainPep)"/>
    <circle cx="0" cy="0" r="21" fill="url(#plainPep)"/>

    <!-- Mushrooms -->
    <path d="M -18,-28 Q -18,-44 -4,-44 Q 10,-44 10,-28 Z" fill="url(#plainMush)" stroke="#64748b" stroke-width="0.8"/>
    <path d="M 28,-12 Q 28,-28 42,-28 Q 56,-28 56,-12 Z" fill="url(#plainMush)" stroke="#64748b" stroke-width="0.8"/>
    <path d="M -28,18 Q -28,2 -14,2 Q 0,2 0,18 Z" fill="url(#plainMush)" stroke="#64748b" stroke-width="0.8"/>
    <path d="M 20,24 Q 20,8 34,8 Q 48,8 48,24 Z" fill="url(#plainMush)" stroke="#64748b" stroke-width="0.8"/>

    <!-- Fresh Basil Leaves -->
    <path d="M -40,-18 Q -28,-30 -22,-18 Q -28,-6 -40,-18 Z" fill="#15803d"/>
    <path d="M 22,-58 Q 34,-68 40,-58 Q 34,-48 22,-58 Z" fill="#16a34a"/>
    <path d="M -34,68 Q -22,58 -16,68 Q -22,78 -34,68 Z" fill="#15803d"/>
    <path d="M 62,24 Q 72,14 78,24 Q 72,34 62,24 Z" fill="#16a34a"/>
  </g>

  <!-- ==================== PIZZA 2 (RIGHT) ==================== -->
  <!-- Note: Intentionally UNMARKED with NO cut lines as required by the source! -->
  <g transform="translate(515, 180)" filter="url(#plainPizzaShadow)">
    <!-- Outer Crust -->
    <circle cx="0" cy="0" r="140" fill="url(#plainCrust)"/>
    <circle cx="0" cy="0" r="134" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="10,8" opacity="0.6"/>
    <!-- Cheese Surface -->
    <circle cx="0" cy="0" r="122" fill="url(#plainCheese2)"/>

    <!-- Assorted Toppings -->
    <!-- Pepperoni -->
    <circle cx="-44" cy="-55" r="19" fill="url(#plainPep)"/>
    <circle cx="52" cy="-45" r="19" fill="url(#plainPep)"/>
    <circle cx="-55" cy="45" r="19" fill="url(#plainPep)"/>
    <circle cx="52" cy="48" r="19" fill="url(#plainPep)"/>
    <circle cx="0" cy="62" r="19" fill="url(#plainPep)"/>
    <circle cx="-66" cy="-5" r="19" fill="url(#plainPep)"/>
    <circle cx="0" cy="-3" r="20" fill="url(#plainPep)"/>

    <!-- Black Olives -->
    <circle cx="12" cy="-34" r="7.5" fill="#1e293b"/>
    <circle cx="12" cy="-34" r="3" fill="#fde047"/>
    <circle cx="-22" cy="18" r="7.5" fill="#1e293b"/>
    <circle cx="-22" cy="18" r="3" fill="#fde047"/>
    <circle cx="40" cy="6" r="7.5" fill="#1e293b"/>
    <circle cx="40" cy="6" r="3" fill="#fde047"/>
    <circle cx="6" cy="28" r="7.5" fill="#1e293b"/>
    <circle cx="6" cy="28" r="3" fill="#fde047"/>

    <!-- Green Peppers -->
    <path d="M -18,-68 Q -6,-80 6,-68 Q 0,-62 -18,-68 Z" fill="#16a34a"/>
    <path d="M 68,-18 Q 78,-6 68,6 Q 62,0 68,-18 Z" fill="#16a34a"/>
    <path d="M -34,-22 Q -22,-32 -16,-22 Q -24,-15 -34,-22 Z" fill="#15803d"/>
    <path d="M 22,-18 Q 32,-26 40,-18 Q 32,-12 22,-18 Z" fill="#16a34a"/>
    <path d="M -12,74 Q 0,82 10,74 Q 0,68 -12,74 Z" fill="#16a34a"/>

    <!-- Mushrooms -->
    <path d="M -40,12 Q -40,-3 -26,-3 Q -12,-3 -12,12 Z" fill="url(#plainMush)" stroke="#64748b" stroke-width="0.8"/>
    <path d="M 14,-62 Q 14,-77 28,-77 Q 42,-77 42,-62 Z" fill="url(#plainMush)" stroke="#64748b" stroke-width="0.8"/>
    <path d="M 25,58 Q 25,43 39,43 Q 53,43 53,58 Z" fill="url(#plainMush)" stroke="#64748b" stroke-width="0.8"/>
  </g>
</svg>
