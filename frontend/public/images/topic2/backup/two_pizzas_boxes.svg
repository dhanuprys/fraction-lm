<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="100%">
  <defs>
    <!-- Cardboard Box Gradients -->
    <linearGradient id="boxOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfbe99"/>
      <stop offset="100%" stop-color="#c49e72"/>
    </linearGradient>
    <linearGradient id="boxInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ab8457"/>
      <stop offset="100%" stop-color="#8c683e"/>
    </linearGradient>
    <linearGradient id="boxFlap" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c9a57b"/>
      <stop offset="100%" stop-color="#b89366"/>
    </linearGradient>

    <!-- Pizza Crust & Sauce Gradients -->
    <radialGradient id="crustGrad" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#f59e0b"/>
      <stop offset="88%" stop-color="#d97706"/>
      <stop offset="96%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="cheeseGrad1" cx="45%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <radialGradient id="cheeseGrad2" cx="48%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="55%" stop-color="#fde047"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>

    <!-- Pepperoni Gradient -->
    <radialGradient id="pepGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="65%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>

    <!-- Mushroom Gradient -->
    <linearGradient id="mushGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="boxShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <filter id="pizzaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#451a03" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="760" height="400" fill="#f8fafc" rx="20"/>

  <!-- ==================== PIZZA BOX 1 (LEFT) ==================== -->
  <g transform="translate(30, 25)" filter="url(#boxShadow)">
    <!-- Open Lid Top Flap (folded back) -->
    <polygon points="20,10 320,10 300,55 40,55" fill="url(#boxFlap)" stroke="#8c683e" stroke-width="1.5"/>
    <!-- Box Inner Floor -->
    <rect x="20" y="55" width="300" height="295" rx="10" fill="url(#boxInner)"/>
    <!-- Box Outer Rim / Front Rim -->
    <path d="M 15,345 L 325,345 L 330,355 L 10,355 Z" fill="url(#boxOuter)"/>
    <!-- Greaseproof Paper Lining -->
    <rect x="35" y="70" width="270" height="265" rx="6" fill="#fefce8" stroke="#fef08a" stroke-dasharray="6,4" stroke-width="1.5" opacity="0.95"/>

    <!-- Pizza 1 -->
    <g transform="translate(170, 202)" filter="url(#pizzaShadow)">
      <!-- Outer Crust -->
      <circle cx="0" cy="0" r="118" fill="url(#crustGrad)"/>
      <!-- Crust Texture Rings -->
      <circle cx="0" cy="0" r="112" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="8,6" opacity="0.6"/>
      <!-- Tomato & Cheese Layer -->
      <circle cx="0" cy="0" r="102" fill="url(#cheeseGrad1)"/>

      <!-- Cut Lines (Divided into 8 slices) -->
      <line x1="-102" y1="0" x2="102" y2="0" stroke="#78350f" stroke-width="2" stroke-dasharray="3,2" opacity="0.75"/>
      <line x1="0" y1="-102" x2="0" y2="102" stroke="#78350f" stroke-width="2" stroke-dasharray="3,2" opacity="0.75"/>
      <line x1="-72" y1="-72" x2="72" y2="72" stroke="#78350f" stroke-width="2" stroke-dasharray="3,2" opacity="0.75"/>
      <line x1="-72" y1="72" x2="72" y2="-72" stroke="#78350f" stroke-width="2" stroke-dasharray="3,2" opacity="0.75"/>

      <!-- Toppings (Pepperoni & Herbs) -->
      <!-- Pepperoni Slices -->
      <circle cx="-42" cy="-45" r="17" fill="url(#pepGrad)"/>
      <circle cx="-42" cy="-45" r="14" fill="none" stroke="#7f1d1d" stroke-width="1" stroke-dasharray="2,3"/>
      <circle cx="48" cy="-35" r="17" fill="url(#pepGrad)"/>
      <circle cx="48" cy="-35" r="14" fill="none" stroke="#7f1d1d" stroke-width="1" stroke-dasharray="2,3"/>
      <circle cx="-50" cy="35" r="17" fill="url(#pepGrad)"/>
      <circle cx="-50" cy="35" r="14" fill="none" stroke="#7f1d1d" stroke-width="1" stroke-dasharray="2,3"/>
      <circle cx="42" cy="45" r="17" fill="url(#pepGrad)"/>
      <circle cx="42" cy="45" r="14" fill="none" stroke="#7f1d1d" stroke-width="1" stroke-dasharray="2,3"/>
      <circle cx="0" cy="-65" r="16" fill="url(#pepGrad)"/>
      <circle cx="0" cy="65" r="16" fill="url(#pepGrad)"/>
      <circle cx="-65" cy="0" r="16" fill="url(#pepGrad)"/>
      <circle cx="65" cy="0" r="16" fill="url(#pepGrad)"/>
      <circle cx="0" cy="0" r="17" fill="url(#pepGrad)"/>

      <!-- Sliced Mushrooms -->
      <path d="M -15,-25 Q -15,-38 -3,-38 Q 9,-38 9,-25 Z" fill="url(#mushGrad)" stroke="#64748b" stroke-width="0.8"/>
      <path d="M 25,-10 Q 25,-23 37,-23 Q 49,-23 49,-10 Z" fill="url(#mushGrad)" stroke="#64748b" stroke-width="0.8"/>
      <path d="M -25,15 Q -25,2  -13,2 Q -1,2 -1,15 Z" fill="url(#mushGrad)" stroke="#64748b" stroke-width="0.8"/>
      <path d="M 18,20 Q 18,7 30,7 Q 42,7 42,20 Z" fill="url(#mushGrad)" stroke="#64748b" stroke-width="0.8"/>

      <!-- Basil Leaves (Green) -->
      <path d="M -35,-15 Q -25,-25 -20,-15 Q -25,-5 -35,-15 Z" fill="#15803d"/>
      <path d="M 20,-50 Q 30,-58 35,-50 Q 30,-42 20,-50 Z" fill="#16a34a"/>
      <path d="M -30,60 Q -20,52 -15,60 Q -20,68 -30,60 Z" fill="#15803d"/>
      <path d="M 55,20 Q 63,12 68,20 Q 63,28 55,20 Z" fill="#16a34a"/>
    </g>
  </g>

  <!-- ==================== PIZZA BOX 2 (RIGHT) ==================== -->
  <g transform="translate(390, 25)" filter="url(#boxShadow)">
    <!-- Open Lid Top Flap (folded back) -->
    <polygon points="20,10 320,10 300,55 40,55" fill="url(#boxFlap)" stroke="#8c683e" stroke-width="1.5"/>
    <!-- Box Inner Floor -->
    <rect x="20" y="55" width="300" height="295" rx="10" fill="url(#boxInner)"/>
    <!-- Box Outer Rim / Front Rim -->
    <path d="M 15,345 L 325,345 L 330,355 L 10,355 Z" fill="url(#boxOuter)"/>
    <!-- Greaseproof Paper Lining -->
    <rect x="35" y="70" width="270" height="265" rx="6" fill="#fefce8" stroke="#fef08a" stroke-dasharray="6,4" stroke-width="1.5" opacity="0.95"/>

    <!-- Pizza 2 -->
    <g transform="translate(170, 202)" filter="url(#pizzaShadow)">
      <!-- Outer Crust -->
      <circle cx="0" cy="0" r="118" fill="url(#crustGrad)"/>
      <circle cx="0" cy="0" r="112" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="8,6" opacity="0.6"/>
      <!-- Tomato & Cheese Layer -->
      <circle cx="0" cy="0" r="102" fill="url(#cheeseGrad2)"/>

      <!-- Cut Lines (Divided into 8 slices) -->
      <line x1="-102" y1="0" x2="102" y2="0" stroke="#78350f" stroke-width="2" stroke-dasharray="3,2" opacity="0.75"/>
      <line x1="0" y1="-102" x2="0" y2="102" stroke="#78350f" stroke-width="2" stroke-dasharray="3,2" opacity="0.75"/>
      <line x1="-72" y1="-72" x2="72" y2="72" stroke="#78350f" stroke-width="2" stroke-dasharray="3,2" opacity="0.75"/>
      <line x1="-72" y1="72" x2="72" y2="-72" stroke="#78350f" stroke-width="2" stroke-dasharray="3,2" opacity="0.75"/>

      <!-- Toppings (Mixed Supreme: Pepperoni, Olives, Bell Peppers, Mushrooms) -->
      <circle cx="-38" cy="-48" r="16" fill="url(#pepGrad)"/>
      <circle cx="45" cy="-40" r="16" fill="url(#pepGrad)"/>
      <circle cx="-48" cy="40" r="16" fill="url(#pepGrad)"/>
      <circle cx="45" cy="42" r="16" fill="url(#pepGrad)"/>
      <circle cx="0" cy="55" r="16" fill="url(#pepGrad)"/>
      <circle cx="-58" cy="-5" r="16" fill="url(#pepGrad)"/>

      <!-- Black Olives -->
      <circle cx="10" cy="-30" r="6.5" fill="#1e293b"/>
      <circle cx="10" cy="-30" r="2.5" fill="#fde047"/>
      <circle cx="-20" cy="15" r="6.5" fill="#1e293b"/>
      <circle cx="-20" cy="15" r="2.5" fill="#fde047"/>
      <circle cx="35" cy="5" r="6.5" fill="#1e293b"/>
      <circle cx="35" cy="5" r="2.5" fill="#fde047"/>
      <circle cx="5" cy="25" r="6.5" fill="#1e293b"/>
      <circle cx="5" cy="25" r="2.5" fill="#fde047"/>

      <!-- Green Bell Peppers -->
      <path d="M -15,-60 Q -5,-70 5,-60 Q 0,-55 -15,-60 Z" fill="#16a34a"/>
      <path d="M 60,-15 Q 68,-5 60,5 Q 55,0 60,-15 Z" fill="#16a34a"/>
      <path d="M -30,-20 Q -20,-28 -15,-20 Q -22,-14 -30,-20 Z" fill="#15803d"/>
      <path d="M 20,-15 Q 28,-22 35,-15 Q 28,-10 20,-15 Z" fill="#16a34a"/>
      <path d="M -10,65 Q 0,72 8,65 Q 0,60 -10,65 Z" fill="#16a34a"/>

      <!-- Sliced Mushrooms -->
      <path d="M -35,10 Q -35,-3 -23,-3 Q -11,-3 -11,10 Z" fill="url(#mushGrad)" stroke="#64748b" stroke-width="0.8"/>
      <path d="M 12,-55 Q 12,-68 24,-68 Q 36,-68 36,-55 Z" fill="url(#mushGrad)" stroke="#64748b" stroke-width="0.8"/>
      <path d="M 22,50 Q 22,37 34,37 Q 46,37 46,50 Z" fill="url(#mushGrad)" stroke="#64748b" stroke-width="0.8"/>
    </g>
  </g>
</svg>
