<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Two matching pizzas ready for drawing fraction partitions</title>
  <desc id="desc">Two same-sized pizzas side by side, with identical simple toppings. Neither pizza has cut lines or portion markings; students can draw the required divisions themselves.</desc>

  <defs>
    <filter id="pizzaShadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7C552F" flood-opacity="0.16"/>
    </filter>
    <g id="pizzaBase">
      <!-- Crust and cheese layers -->
      <circle r="105" fill="#D77F35" stroke="#A75E2B" stroke-width="2"/>
      <circle r="97" fill="#F6C65B"/>
      <circle r="88" fill="#FFDE7A" stroke="#EBAF43" stroke-width="1.6"/>
      <!-- Gentle baked spots along the crust -->
      <circle cx="-64" cy="-75" r="3" fill="#F3B25A" opacity="0.85"/>
      <circle cx="25" cy="-96" r="2.6" fill="#F3B25A" opacity="0.85"/>
      <circle cx="79" cy="-55" r="3" fill="#F3B25A" opacity="0.85"/>
      <circle cx="90" cy="19" r="2.7" fill="#F3B25A" opacity="0.85"/>
      <circle cx="-82" cy="35" r="2.8" fill="#F3B25A" opacity="0.85"/>
      <circle cx="-30" cy="93" r="3" fill="#F3B25A" opacity="0.85"/>
    </g>
    <g id="pizzaToppings">
      <!-- Toppings sit on top of the cut lines, like a real pizza -->
      <g fill="#E85E57" stroke="#C84745" stroke-width="1.5">
        <circle cx="44" cy="-18" r="13.5"/>
        <circle cx="-18" cy="-46" r="13.5"/>
        <circle cx="-48" cy="24" r="13.5"/>
        <circle cx="20" cy="48" r="13.5"/>
      </g>
      <g fill="#2F9C72">
        <path d="M-18 -66 C-7 -78 2 -71 -1 -62 C-7 -58 -14 -61 -18 -66Z"/>
        <path d="M60 35 C73 28 79 37 72 44 C66 44 62 41 60 35Z"/>
        <path d="M-68 -18 C-57 -29 -49 -22 -54 -14 C-60 -12 -65 -14 -68 -18Z"/>
      </g>
      <g fill="#F8EAD0" stroke="#C7A77A" stroke-width="1.2">
        <path d="M-42 57 C-42 43 -28 40 -20 50 L-20 57Z"/>
        <path d="M63 -40 C63 -53 77 -56 84 -47 L84 -40Z"/>
      </g>
      <g fill="#40516A" stroke="#FFF1B8" stroke-width="2">
        <circle cx="30" cy="-59" r="5.8"/>
        <circle cx="-64" cy="43" r="5.8"/>
      </g>
    </g>
  </defs>
  <rect width="700" height="360" rx="24" fill="#FFFCF6"/>
  <rect x="1" y="1" width="698" height="358" rx="23" fill="none" stroke="#F0E7D8" stroke-width="2"/>
  <g filter="url(#pizzaShadow)">
    <use href="#pizzaBase" transform="translate(190 180)"/>
    <use href="#pizzaBase" transform="translate(510 180)"/>
  </g>
  <use href="#pizzaToppings" transform="translate(190 180)"/>
  <use href="#pizzaToppings" transform="translate(510 180)"/>
</svg>