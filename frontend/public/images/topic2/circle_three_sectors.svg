<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Circle divided into one half and two quarters</title>
  <desc id="desc">A clean circular fraction diagram. The bottom half is orange, the upper-left quarter is gray, and the upper-right quarter is blue. White lines meet at the center.</desc>
  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#344256" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="#FFFCF6"/>
  <rect x="1" y="1" width="398" height="398" rx="23" fill="none" stroke="#F0E7D8" stroke-width="2"/>
  <g filter="url(#softShadow)">
    <!-- Bottom half: 1/2 -->
    <path d="M 200 200 L 352 200 A 152 152 0 0 1 48 200 Z" fill="#F4A261"/>
    <!-- Upper-left quarter: 1/4 -->
    <path d="M 200 200 L 48 200 A 152 152 0 0 1 200 48 Z" fill="#BEC8D3"/>
    <!-- Upper-right quarter: 1/4 -->
    <path d="M 200 200 L 200 48 A 152 152 0 0 1 352 200 Z" fill="#8CC8F5"/>
    <circle cx="200" cy="200" r="152" fill="none" stroke="#35465A" stroke-width="3"/>
    <line x1="48" y1="200" x2="352" y2="200" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <line x1="200" y1="48" x2="200" y2="200" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>