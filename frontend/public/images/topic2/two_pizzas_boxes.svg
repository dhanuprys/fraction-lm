<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Two pizzas in open boxes, one cut into eight equal slices and one into four</title>
  <desc id="desc">Two same-sized pizzas with matching toppings sit in simple open cardboard pizza boxes. The left pizza is divided into eight equal slices by four diameters. The right pizza is divided into four equal slices by two perpendicular diameters.</desc>

  <defs>
    <filter id="pizzaShadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#7C552F" flood-opacity="0.16"/>
    </filter>
    <g id="pizzaBase">
      <!-- Crust and cheese layers -->
      <circle r="105" fill="#D77F35" stroke="#A75E2B" stroke-width="2"/>
      <circle r="97" fill="#F6C65B"/>
      <circle r="88" fill="#FFDE7A" stroke="#EBAF43" stroke-width="1.6"/>
      <!-- Gentle baked spots along the crust -->
      <circle cx="-64" cy="-75" r="3" fill="#F3B25A" opacity="0.85"/>
      <circle cx="25" cy="-96" r="2.6" fill="#F3B25A" opacity="0.85"/>
      <circle cx="79" cy="-55" r="3" fill="#F3B25A" opacity="0.85"/>
      <circle cx="90" cy="19" r="2.7" fill="#F3B25A" opacity="0.85"/>
      <circle cx="-82" cy="35" r="2.8" fill="#F3B25A" opacity="0.85"/>
      <circle cx="-30" cy="93" r="3" fill="#F3B25A" opacity="0.85"/>
    </g>
    <g id="pizzaToppings">
      <!-- Toppings sit on top of the cut lines, like a real pizza -->
      <g fill="#E85E57" stroke="#C84745" stroke-width="1.5">
        <circle cx="44" cy="-18" r="13.5"/>
        <circle cx="-18" cy="-46" r="13.5"/>
        <circle cx="-48" cy="24" r="13.5"/>
        <circle cx="20" cy="48" r="13.5"/>
      </g>
      <g fill="#2F9C72">
        <path d="M-18 -66 C-7 -78 2 -71 -1 -62 C-7 -58 -14 -61 -18 -66Z"/>
        <path d="M60 35 C73 28 79 37 72 44 C66 44 62 41 60 35Z"/>
        <path d="M-68 -18 C-57 -29 -49 -22 -54 -14 C-60 -12 -65 -14 -68 -18Z"/>
      </g>
      <g fill="#F8EAD0" stroke="#C7A77A" stroke-width="1.2">
        <path d="M-42 57 C-42 43 -28 40 -20 50 L-20 57Z"/>
        <path d="M63 -40 C63 -53 77 -56 84 -47 L84 -40Z"/>
      </g>
      <g fill="#40516A" stroke="#FFF1B8" stroke-width="2">
        <circle cx="30" cy="-59" r="5.8"/>
        <circle cx="-64" cy="43" r="5.8"/>
      </g>
    </g>
  </defs>
  <rect width="760" height="400" rx="24" fill="#FFFCF6"/>
  <rect x="1" y="1" width="758" height="398" rx="23" fill="none" stroke="#F0E7D8" stroke-width="2"/>
  <!-- Box lids sit behind the box bodies -->
  <g fill="#D9B789" stroke="#B58D5B" stroke-width="2" stroke-linejoin="round">
    <path d="M52 88 L36 38 Q190 18 344 38 L328 88 Z"/>
    <path d="M432 88 L416 38 Q570 18 724 38 L708 88 Z"/>
  </g>
  <!-- Matching open box bases -->
  <g>
    <rect x="28" y="76" width="324" height="292" rx="14" fill="#D8B487" stroke="#B58D5B" stroke-width="2.2"/>
    <rect x="42" y="90" width="296" height="264" rx="10" fill="#F4E5CB" stroke="#E1C79D" stroke-width="1.5"/>
    <rect x="408" y="76" width="324" height="292" rx="14" fill="#D8B487" stroke="#B58D5B" stroke-width="2.2"/>
    <rect x="422" y="90" width="296" height="264" rx="10" fill="#F4E5CB" stroke="#E1C79D" stroke-width="1.5"/>
  </g>
  <!-- Pizzas use identical size and toppings; only the number of equal portions differs. -->
  <g filter="url(#pizzaShadow)">
    <use href="#pizzaBase" transform="translate(190 222)"/>
    <use href="#pizzaBase" transform="translate(570 222)"/>
  </g>
  <!-- Left: four diameters create eight equal slices. -->
  <g transform="translate(190 222)" stroke="#FFF9E8" stroke-width="2.7" stroke-linecap="round" opacity="0.98">
    <line x1="-87" y1="0" x2="87" y2="0"/>
    <line x1="0" y1="-87" x2="0" y2="87"/>
    <line x1="-61.5" y1="-61.5" x2="61.5" y2="61.5"/>
    <line x1="-61.5" y1="61.5" x2="61.5" y2="-61.5"/>
  </g>
  <!-- Right: two perpendicular diameters create four equal slices. -->
  <g transform="translate(570 222)" stroke="#FFF9E8" stroke-width="2.7" stroke-linecap="round" opacity="0.98">
    <line x1="-87" y1="0" x2="87" y2="0"/>
    <line x1="0" y1="-87" x2="0" y2="87"/>
  </g>
  <!-- Repeated toppings overlay the cuts, so they stay visually intact. -->
  <use href="#pizzaToppings" transform="translate(190 222)"/>
  <use href="#pizzaToppings" transform="translate(570 222)"/>
</svg>