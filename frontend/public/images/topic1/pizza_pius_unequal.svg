<text x="450" y="44" font-size="27" font-weight="800" fill="#24364B" text-anchor="middle" >Cara Pius Memotong Pizza Menjadi 3 Bagian</text>
<text x="450" y="72" font-size="16" font-weight="600" fill="#5D7185" text-anchor="middle" >Tiga potongan belum tentu sama besar.</text>
