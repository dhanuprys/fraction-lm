<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 450" width="100%" height="100%" style="font-family: 'Nunito', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="pius-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <filter id="bubble-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08" />
    </filter>

    <!-- Pizza Gradients -->
    <radialGradient id="pius-board" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="85%" stop-color="#e0bb82" />
      <stop offset="100%" stop-color="#c99e65" />
    </radialGradient>
    <radialGradient id="pius-crust" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#f6ad55" />
      <stop offset="95%" stop-color="#dd6b20" />
      <stop offset="100%" stop-color="#c05621" />
    </radialGradient>
    <radialGradient id="pius-cheese" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="90%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </radialGradient>

    <!-- Clip Path for Pizza Circle (Radius 140 at 220, 230) -->
    <clipPath id="pizza-circle">
      <circle cx="220" cy="230" r="140" />
    </clipPath>
  </defs>

  <!-- Background Card -->
  <rect width="740" height="450" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Card Header -->
  <rect x="0" y="0" width="740" height="56" rx="24" fill="#f8fafc" />
  <rect x="0" y="36" width="740" height="20" fill="#f8fafc" />
  <line x1="0" y1="56" x2="740" y2="56" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="370" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#1e293b">
    🔪 Cara Pius Memotong Pizza Menjadi 3 Bagian
  </text>

  <!-- ==================== LEFT: THE UNEQUALLY CUT PIZZA ==================== -->
  <!-- Wooden Board -->
  <circle cx="220" cy="230" r="162" fill="url(#pius-board)" stroke="#b48348" stroke-width="4" filter="url(#pius-shadow)" />

  <!-- Whole Pizza Base -->
  <g clip-path="url(#pizza-circle)">
    <!-- Pizza Crust and Cheese -->
    <circle cx="220" cy="230" r="140" fill="url(#pius-crust)" stroke="#dd6b20" stroke-width="2" />
    <circle cx="220" cy="230" r="126" fill="url(#pius-cheese)" />

    <!-- Pizza Toppings across whole pizza -->
    <!-- Pepperoni slices -->
    <circle cx="160" cy="180" r="15" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
    <circle cx="220" cy="160" r="16" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
    <circle cx="270" cy="195" r="14" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
    <circle cx="180" cy="250" r="16" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
    <circle cx="235" cy="245" r="17" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
    <circle cx="200" cy="305" r="14" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
    <circle cx="265" cy="285" r="15" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
    <circle cx="135" cy="280" r="13" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
    <!-- Basil leaves -->
    <ellipse cx="195" cy="205" rx="8" ry="4" fill="#22c55e" transform="rotate(30 195 205)" />
    <ellipse cx="250" cy="160" rx="8" ry="4" fill="#22c55e" transform="rotate(-40 250 160)" />
    <ellipse cx="150" cy="225" rx="8" ry="4" fill="#22c55e" transform="rotate(15 150 225)" />
    <ellipse cx="220" cy="290" rx="8" ry="4" fill="#22c55e" transform="rotate(-20 220 290)" />

    <!-- Highlight Overlay on Middle Region B (Pius' Slice) -->
    <!-- Cut 1: from (60, 160) to (380, 200) - approx parallel line 1 -->
    <!-- Cut 2: from (60, 280) to (380, 320) - approx parallel line 2 -->
    <polygon points="60,165 380,205 380,295 60,255" fill="#3b82f6" opacity="0.18" />

    <!-- TWO PARALLEL BLACK CUT LINES -->
    <!-- Cut Line 1 (Upper cut) -->
    <line x1="60" y1="165" x2="380" y2="205" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
    <!-- Cut Line 2 (Lower cut) -->
    <line x1="60" y1="255" x2="380" y2="295" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Labels on Pizza Regions -->
  <!-- Region 1: Top small slice -->
  <rect x="180" y="115" width="80" height="24" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <text x="220" y="131" text-anchor="middle" font-size="11" font-weight="800" fill="#64748b">Potongan 1 (Kecil)</text>

  <!-- Region 2: Pius' big middle strip -->
  <rect x="150" y="218" width="140" height="28" rx="14" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5" filter="url(#bubble-shadow)" />
  <text x="220" y="237" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">★ Potongan Pius (Sangat Besar)</text>

  <!-- Region 3: Bottom small slice -->
  <rect x="180" y="325" width="80" height="24" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <text x="220" y="341" text-anchor="middle" font-size="11" font-weight="800" fill="#64748b">Potongan 3 (Kecil)</text>

  <!-- ==================== RIGHT: PIUS' CLAIM & QUESTIONS ==================== -->
  <g transform="translate(420, 80)">
    <!-- Speech Bubble Container -->
    <rect width="280" height="180" rx="18" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2" filter="url(#bubble-shadow)" />
    <!-- Speech bubble pointer -->
    <polygon points="-12,50 0,40 0,60" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2" />
    <line x1="0" y1="41" x2="0" y2="59" stroke="#f0f9ff" stroke-width="3" />

    <!-- Avatar / Speaker Title -->
    <circle cx="36" cy="36" r="18" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
    <text x="36" y="42" text-anchor="middle" font-size="18">👦</text>
    <text x="64" y="35" font-size="14" font-weight="800" fill="#0369a1">Pius berkata:</text>
    <text x="64" y="49" font-size="11" font-weight="600" fill="#0284c7">Kakak tertua</text>

    <!-- Pius Quote -->
    <rect x="18" y="65" width="244" height="98" rx="10" fill="#ffffff" stroke="#e0f2fe" stroke-width="1" />
    <text x="30" y="88" font-size="12.5" font-style="italic" font-weight="700" fill="#0f172a">
      “Saya mengambil potongan
    </text>
    <text x="30" y="106" font-size="12.5" font-style="italic" font-weight="700" fill="#0f172a">
      yang di tengah. Potongan itu
    </text>
    <text x="30" y="124" font-size="12.5" font-style="italic" font-weight="700" fill="#0f172a">
      adalah satu dari 3 potongan,
    </text>
    <text x="30" y="146" font-size="13" font-style="italic" font-weight="900" fill="#2563eb">
      jadi sepertiga (1/3) pizza!”
    </text>

    <!-- Story context box below -->
    <g transform="translate(0, 195)">
      <rect width="280" height="145" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="36" cy="30" r="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
      <text x="36" y="36" text-anchor="middle" font-size="16">👩</text>
      <text x="62" y="30" font-size="13" font-weight="800" fill="#92400e">Pesan Ibu:</text>
      <text x="62" y="44" font-size="11" font-weight="600" fill="#b45309">Kepada Pius dan saudaranya</text>
      <rect x="18" y="56" width="244" height="42" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="1" />
      <text x="28" y="73" font-size="11.5" font-style="italic" font-weight="600" fill="#334155">
        “Potonglah pizza sedemikian rupa
      </text>
      <text x="28" y="90" font-size="11.5" font-style="italic" font-weight="700" fill="#0f172a">
        agar tiap anak dapat <tspan fill="#d97706" font-weight="800">sepertiga (1/3)</tspan> bagian.”
      </text>
      <text x="20" y="124" font-size="11.5" font-weight="700" fill="#64748b">
        👉 Amati bentuk potongan pizza Pius!
      </text>
    </g>
  </g>
</svg>
