<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="100%" height="100%" role="img" aria-labelledby="title desc" style="font-family:'Nunito', 'Aptos', 'Segoe UI', Arial, sans-serif;">
<title id="title">Cara Pius Memotong Pizza Menjadi 3 Bagian</title><desc id="desc">A pizza is cut by two off-center parallel chords, creating a small top piece, a much larger middle piece, and a small bottom piece. The diagram illustrates that three pieces are not necessarily thirds unless they are equal in size.</desc>
