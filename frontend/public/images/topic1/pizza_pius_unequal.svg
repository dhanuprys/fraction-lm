<rect x="153" y="302" width="158" height="32" rx="16.0" fill="#FFF5D8" stroke="#E9BD54" stroke-width="1.5"/>
<text x="232.0" y="322.42" font-size="13" font-weight="800" fill="#24364B" text-anchor="middle" >2 • jauh lebih besar</text>
