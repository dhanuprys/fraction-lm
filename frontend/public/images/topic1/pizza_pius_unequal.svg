<text x="232.0" y="475.92" font-size="13" font-weight="800" fill="#24364B" text-anchor="middle" >3 • kecil</text>
<rect x="486" y="113" width="128" height="29" rx="14.5" fill="#DCEEFF" stroke="#C4E0F5" stroke-width="1.5"/>
<text x="550.0" y="132.26" font-size="14" font-weight="800" fill="#176CA5" text-anchor="middle" >Pius berkata</text>
<text x="488" y="164" font-size="14" font-weight="600" fill="#24364B" text-anchor="start" >“Saya mengambil potongan yang di tengah.</text>
<text x="488" y="187" font-size="14" font-weight="600" fill="#24364B" text-anchor="start" >Potongan itu adalah satu dari 3 potongan,</text>
<text x="488" y="210" font-size="14" font-weight="800" fill="#176CA5" text-anchor="start" >jadi sepertiga (1/3) pizza!”</text>
<rect x="486" y="348" width="110" height="29" rx="14.5" fill="#DDF4E7" stroke="#C2E7D1" stroke-width="1.5"/>
<text x="541.0" y="367.26" font-size="14" font-weight="800" fill="#26865D" text-anchor="middle" >Pesan Ibu</text>
<text x="488" y="397" font-size="14" font-weight="600" fill="#24364B" text-anchor="start" >“Potonglah pizza sedemikian rupa agar</text>
<text x="488" y="420" font-size="14" font-weight="600" fill="#24364B" text-anchor="start" >tiap anak dapat sepertiga (1/3) bagian.”</text>
<text x="667" y="467" font-size="14" font-weight="800" fill="#26865D" text-anchor="middle" >Amati bentuk potongan pizza Pius!</text>
<text x="667" y="496" font-size="13" font-weight="600" fill="#5D7185" text-anchor="middle" >Hanya potongan yang sama besar</text>
<text x="667" y="516" font-size="13" font-weight="600" fill="#5D7185" text-anchor="middle" >yang dapat disebut sepertiga bagian.</text>
