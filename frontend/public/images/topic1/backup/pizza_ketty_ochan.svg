<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="100%" height="100%" style="font-family: 'Nunito', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Shadows & Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#475569" flood-opacity="0.12" />
    </filter>
    <filter id="board-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#78350f" flood-opacity="0.18" />
    </filter>
    <filter id="pizza-slice-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.15" />
    </filter>

    <!-- Gradients -->
    <radialGradient id="wood-board" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5deb3" />
      <stop offset="85%" stop-color="#e0bb82" />
      <stop offset="100%" stop-color="#c99e65" />
    </radialGradient>
    <radialGradient id="pizza-crust" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#f6ad55" />
      <stop offset="92%" stop-color="#dd6b20" />
      <stop offset="100%" stop-color="#c05621" />
    </radialGradient>
    <radialGradient id="pizza-cheese" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="840" height="440" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Subtle header bar -->
  <rect x="0" y="0" width="840" height="60" rx="24" fill="#f8fafc" />
  <rect x="0" y="40" width="840" height="20" fill="#f8fafc" />
  <line x1="0" y1="60" x2="840" y2="60" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="420" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#1e293b">
    🍕 Pizza Ketty dan Pizza Ochan
  </text>

  <!-- ==================== LEFT: PIZZA KETTY (8 POTONG) ==================== -->
  <g transform="translate(220, 240)">
    <!-- Wooden Serving Board -->
    <circle cx="0" cy="0" r="148" fill="url(#wood-board)" stroke="#b48348" stroke-width="4" filter="url(#board-shadow)" />
    <!-- Wooden handle -->
    <path d="M 0 148 L -18 195 C -18 202, 18 202, 18 195 L 0 148 Z" fill="#c99e65" stroke="#b48348" stroke-width="3" />
    <circle cx="0" cy="188" r="6" fill="#fff" opacity="0.7" />

    <!-- Empty slices on board (Crumbs & cut lines showing 3 slices eaten: angles 0° to 135°) -->
    <path d="M 0 0 L 130 0 A 130 130 0 0 1 -0.01 130 Z" fill="#dfb980" opacity="0.6" />
    <path d="M 0 0 L -0.01 130 A 130 130 0 0 1 -91.92 91.92 Z" fill="#d9b275" opacity="0.6" />
    <!-- Cut lines for eaten slices -->
    <line x1="0" y1="0" x2="130" y2="0" stroke="#a3763f" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="0" y1="0" x2="91.92" y2="91.92" stroke="#a3763f" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="0" y1="0" x2="0" y2="130" stroke="#a3763f" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="0" y1="0" x2="-91.92" y2="91.92" stroke="#a3763f" stroke-width="2" stroke-dasharray="4,4" />
    <!-- Crumbs -->
    <circle cx="50" cy="40" r="2.5" fill="#92400e" />
    <circle cx="70" cy="65" r="3" fill="#b45309" />
    <circle cx="35" cy="85" r="2" fill="#78350f" />
    <circle cx="-40" cy="70" r="2.5" fill="#92400e" />
    <circle cx="-25" cy="45" r="2" fill="#b45309" />
    <circle cx="15" cy="25" r="1.5" fill="#78350f" />
    <!-- Indicator on empty area -->
    <rect x="-10" y="40" width="105" height="32" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" opacity="0.9" />
    <text x="42.5" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">Bagian Dimakan 🍽️</text>

    <!-- 5 Remaining Slices (135° to 360°) -->
    <!-- Slice 4 (135° to 180°) -->
    <path d="M 0 0 L -91.92 91.92 A 130 130 0 0 1 -130 0 Z" fill="url(#pizza-crust)" stroke="#dd6b20" stroke-width="1.5" filter="url(#pizza-slice-shadow)" />
    <path d="M 0 0 L -81.3 81.3 A 115 115 0 0 1 -115 0 Z" fill="url(#pizza-cheese)" />
    <circle cx="-65" cy="35" r="8" fill="#ef4444" />
    <circle cx="-85" cy="18" r="6" fill="#ef4444" />

    <!-- Slice 5 (180° to 225°) -->
    <path d="M 0 0 L -130 0 A 130 130 0 0 1 -91.92 -91.92 Z" fill="url(#pizza-crust)" stroke="#dd6b20" stroke-width="1.5" filter="url(#pizza-slice-shadow)" />
    <path d="M 0 0 L -115 0 A 115 115 0 0 1 -81.3 -81.3 Z" fill="url(#pizza-cheese)" />
    <circle cx="-75" cy="-35" r="7" fill="#ef4444" />
    <circle cx="-45" cy="-20" r="5" fill="#22c55e" />

    <!-- Slice 6 (225° to 270°) -->
    <path d="M 0 0 L -91.92 -91.92 A 130 130 0 0 1 0 -130 Z" fill="url(#pizza-crust)" stroke="#dd6b20" stroke-width="1.5" filter="url(#pizza-slice-shadow)" />
    <path d="M 0 0 L -81.3 -81.3 A 115 115 0 0 1 0 -115 Z" fill="url(#pizza-cheese)" />
    <circle cx="-35" cy="-65" r="8" fill="#ef4444" />
    <circle cx="-15" cy="-40" r="5" fill="#22c55e" />

    <!-- Slice 7 (270° to 315°) -->
    <path d="M 0 0 L 0 -130 A 130 130 0 0 1 91.92 -91.92 Z" fill="url(#pizza-crust)" stroke="#dd6b20" stroke-width="1.5" filter="url(#pizza-slice-shadow)" />
    <path d="M 0 0 L 0 -115 A 115 115 0 0 1 81.3 -81.3 Z" fill="url(#pizza-cheese)" />
    <circle cx="35" cy="-65" r="7" fill="#ef4444" />
    <circle cx="50" cy="-30" r="5.5" fill="#22c55e" />

    <!-- Slice 8 (315° to 360°) -->
    <path d="M 0 0 L 91.92 -91.92 A 130 130 0 0 1 130 0 Z" fill="url(#pizza-crust)" stroke="#dd6b20" stroke-width="1.5" filter="url(#pizza-slice-shadow)" />
    <path d="M 0 0 L 81.3 -81.3 A 115 115 0 0 1 115 0 Z" fill="url(#pizza-cheese)" />
    <circle cx="75" cy="-25" r="8" fill="#ef4444" />
    <circle cx="35" cy="-15" r="6" fill="#ef4444" />

    <!-- Slice separator lines for existing slices -->
    <line x1="0" y1="0" x2="-130" y2="0" stroke="#c05621" stroke-width="2" />
    <line x1="0" y1="0" x2="-91.92" y2="-91.92" stroke="#c05621" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="-130" stroke="#c05621" stroke-width="2" />
    <line x1="0" y1="0" x2="91.92" y2="-91.92" stroke="#c05621" stroke-width="2" />

    <!-- Title Badge -->
    <g transform="translate(0, -170)">
      <rect x="-110" y="0" width="220" height="34" rx="17" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" />
      <text x="0" y="22" text-anchor="middle" font-size="14" font-weight="800" fill="#6d28d9">
        🐱 Pizza Ketty
      </text>
    </g>

    <!-- Subtitle info -->
    <text x="0" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">
      Dipotong menjadi <tspan fill="#7c3aed" font-weight="800">8 bagian sama besar</tspan>
    </text>
  </g>

  <!-- Divider -->
  <line x1="420" y1="80" x2="420" y2="410" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6" />

  <!-- ==================== RIGHT: PIZZA OCHAN (6 POTONG) ==================== -->
  <g transform="translate(620, 240)">
    <!-- Wooden Serving Board -->
    <circle cx="0" cy="0" r="148" fill="url(#wood-board)" stroke="#b48348" stroke-width="4" filter="url(#board-shadow)" />
    <!-- Wooden handle -->
    <path d="M 0 148 L -18 195 C -18 202, 18 202, 18 195 L 0 148 Z" fill="#c99e65" stroke="#b48348" stroke-width="3" />
    <circle cx="0" cy="188" r="6" fill="#fff" opacity="0.7" />

    <!-- Empty slices on board (3 slices eaten: right side 0° to 180°, angles from -90° to 90°) -->
    <path d="M 0 -130 A 130 130 0 0 1 0 130 Z" fill="#dfb980" opacity="0.6" />
    <!-- Cut lines for eaten slices -->
    <line x1="0" y1="0" x2="112.58" y2="-65" stroke="#a3763f" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="0" y1="0" x2="112.58" y2="65" stroke="#a3763f" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="0" y1="0" x2="0" y2="130" stroke="#a3763f" stroke-width="2" stroke-dasharray="4,4" />
    <line x1="0" y1="0" x2="0" y2="-130" stroke="#a3763f" stroke-width="2" stroke-dasharray="4,4" />
    <!-- Crumbs -->
    <circle cx="55" cy="-30" r="2.5" fill="#92400e" />
    <circle cx="70" cy="15" r="3" fill="#b45309" />
    <circle cx="45" cy="55" r="2" fill="#78350f" />
    <circle cx="25" cy="-10" r="2" fill="#92400e" />
    <!-- Indicator on empty area -->
    <rect x="15" y="-16" width="105" height="32" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" opacity="0.9" />
    <text x="67.5" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">Bagian Dimakan 🍽️</text>

    <!-- 3 Remaining Slices (180° of the circle on left side) -->
    <!-- Slice 1 (90° to 150° from -y: left-bottom) -->
    <path d="M 0 0 L 0 130 A 130 130 0 0 1 -112.58 65 Z" fill="url(#pizza-crust)" stroke="#dd6b20" stroke-width="1.5" filter="url(#pizza-slice-shadow)" />
    <path d="M 0 0 L 0 115 A 115 115 0 0 1 -99.59 57.5 Z" fill="url(#pizza-cheese)" />
    <circle cx="-45" cy="65" r="8" fill="#ef4444" />
    <circle cx="-20" cy="35" r="5.5" fill="#22c55e" />

    <!-- Slice 2 (150° to 210° from -y: left-middle) -->
    <path d="M 0 0 L -112.58 65 A 130 130 0 0 1 -112.58 -65 Z" fill="url(#pizza-crust)" stroke="#dd6b20" stroke-width="1.5" filter="url(#pizza-slice-shadow)" />
    <path d="M 0 0 L -99.59 57.5 A 115 115 0 0 1 -99.59 -57.5 Z" fill="url(#pizza-cheese)" />
    <circle cx="-75" cy="0" r="9" fill="#ef4444" />
    <circle cx="-40" cy="0" r="6" fill="#22c55e" />

    <!-- Slice 3 (210° to 270° from -y: left-top) -->
    <path d="M 0 0 L -112.58 -65 A 130 130 0 0 1 0 -130 Z" fill="url(#pizza-crust)" stroke="#dd6b20" stroke-width="1.5" filter="url(#pizza-slice-shadow)" />
    <path d="M 0 0 L -99.59 -57.5 A 115 115 0 0 1 0 -115 Z" fill="url(#pizza-cheese)" />
    <circle cx="-45" cy="-65" r="8" fill="#ef4444" />
    <circle cx="-20" cy="-35" r="5.5" fill="#22c55e" />

    <!-- Slice separator lines -->
    <line x1="0" y1="0" x2="-112.58" y2="65" stroke="#c05621" stroke-width="2" />
    <line x1="0" y1="0" x2="-112.58" y2="-65" stroke="#c05621" stroke-width="2" />

    <!-- Title Badge -->
    <g transform="translate(0, -170)">
      <rect x="-110" y="0" width="220" height="34" rx="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
      <text x="0" y="22" text-anchor="middle" font-size="14" font-weight="800" fill="#0369a1">
        🐱 Pizza Ochan
      </text>
    </g>

    <!-- Subtitle info -->
    <text x="0" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">
      Dipotong menjadi <tspan fill="#0284c7" font-weight="800">6 bagian sama besar</tspan>
    </text>
  </g>
</svg>
