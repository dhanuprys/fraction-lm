<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%" style="font-family: 'Nunito', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="ivon-card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="grid-cell-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="760" height="480" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Header -->
  <rect x="0" y="0" width="760" height="56" rx="24" fill="#f8fafc" />
  <rect x="0" y="36" width="760" height="20" fill="#f8fafc" />
  <line x1="0" y1="56" x2="760" y2="56" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="380" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#1e293b">
    💡 Cara Ivon Menemukan 1/6 dari 12 Kotak
  </text>

  <!-- ==================== TOP: ELSA VS IVON DIALOGUE ==================== -->
  <!-- Elsa Card -->
  <g transform="translate(40, 75)">
    <rect width="320" height="95" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#ivon-card-shadow)" />
    <circle cx="28" cy="28" r="16" fill="#fee2e2" />
    <text x="28" y="34" text-anchor="middle" font-size="16">👧</text>
    <text x="52" y="27" font-size="13" font-weight="800" fill="#991b1b">Elsa berkata:</text>
    <text x="52" y="42" font-size="10" font-weight="600" fill="#b91c1c">Mengalami kebingungan</text>
    <text x="16" y="66" font-size="11.5" font-style="italic" font-weight="600" fill="#7f1d1d">
      “Soal ini tidak bisa diselesaikan karena
    </text>
    <text x="16" y="83" font-size="11.5" font-style="italic" font-weight="600" fill="#7f1d1d">
      kotaknya ada <tspan font-weight="900" fill="#dc2626">12</tspan>, bukan <tspan font-weight="900" fill="#dc2626">6</tspan>!”
    </text>
  </g>

  <!-- Ivon Card -->
  <g transform="translate(400, 75)">
    <rect width="320" height="95" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#ivon-card-shadow)" />
    <circle cx="28" cy="28" r="16" fill="#dcfce7" />
    <text x="28" y="34" text-anchor="middle" font-size="16">🧑‍🏫</text>
    <text x="52" y="27" font-size="13" font-weight="800" fill="#166534">Ivon berkata (BENAR!):</text>
    <text x="52" y="42" font-size="10" font-weight="600" fill="#15803d">Melihat pecahan senilai</text>
    <text x="16" y="66" font-size="11.5" font-style="italic" font-weight="600" fill="#14532d">
      “Bayangkan 12 kotak dibagi untuk 6 orang:
    </text>
    <text x="16" y="83" font-size="11.5" font-style="italic" font-weight="800" fill="#15803d">
      12 ÷ 6 = 2 kotak. Jadi <tspan font-weight="900" fill="#16a34a">1/6 = 2 kotak</tspan>!”
    </text>
  </g>

  <!-- ==================== CENTER: THE 3x4 GRID WITH 6 COLOR PAIRS ==================== -->
  <g transform="translate(190, 195)">
    <!-- Grid Frame -->
    <rect x="-10" y="-10" width="400" height="190" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#ivon-card-shadow)" />

    <!-- Grid Dimensions: 3 rows x 4 columns = 12 cells. Each cell width=95, height=55 -->
    <!-- ROW 1 -->
    <!-- Pair 1: Orange (Col 0, 1) = 1/6 ke-1 -->
    <rect x="0" y="0" width="92" height="52" rx="8" fill="#f97316" stroke="#c2410c" stroke-width="2" filter="url(#grid-cell-shadow)" />
    <rect x="97" y="0" width="92" height="52" rx="8" fill="#f97316" stroke="#c2410c" stroke-width="2" filter="url(#grid-cell-shadow)" />
    <text x="94" y="31" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">Bagian 1 (Oranye) = 1/6</text>

    <!-- Pair 2: Blue (Col 2, 3) = 1/6 ke-2 -->
    <rect x="194" y="0" width="92" height="52" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" filter="url(#grid-cell-shadow)" />
    <rect x="291" y="0" width="92" height="52" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" filter="url(#grid-cell-shadow)" />
    <text x="288" y="31" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">Bagian 2 (Biru) = 1/6</text>

    <!-- ROW 2 -->
    <!-- Pair 3: Gray (Col 0, 1) = 1/6 ke-3 -->
    <rect x="0" y="58" width="92" height="52" rx="8" fill="#94a3b8" stroke="#475569" stroke-width="2" filter="url(#grid-cell-shadow)" />
    <rect x="97" y="58" width="92" height="52" rx="8" fill="#94a3b8" stroke="#475569" stroke-width="2" filter="url(#grid-cell-shadow)" />
    <text x="94" y="89" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">Bagian 3 (Abu-abu) = 1/6</text>

    <!-- Pair 4: Cyan (Col 2, 3) = 1/6 ke-4 -->
    <rect x="194" y="58" width="92" height="52" rx="8" fill="#06b6d4" stroke="#0e7490" stroke-width="2" filter="url(#grid-cell-shadow)" />
    <rect x="291" y="58" width="92" height="52" rx="8" fill="#06b6d4" stroke="#0e7490" stroke-width="2" filter="url(#grid-cell-shadow)" />
    <text x="288" y="89" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">Bagian 4 (Sian) = 1/6</text>

    <!-- ROW 3 -->
    <!-- Pair 5: Green (Col 0, 1) = 1/6 ke-5 -->
    <rect x="0" y="116" width="92" height="52" rx="8" fill="#22c55e" stroke="#15803d" stroke-width="2" filter="url(#grid-cell-shadow)" />
    <rect x="97" y="116" width="92" height="52" rx="8" fill="#22c55e" stroke="#15803d" stroke-width="2" filter="url(#grid-cell-shadow)" />
    <text x="94" y="147" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">Bagian 5 (Hijau) = 1/6</text>

    <!-- Pair 6: Yellow (Col 2, 3) = 1/6 ke-6 -->
    <rect x="194" y="116" width="92" height="52" rx="8" fill="#eab308" stroke="#a16207" stroke-width="2" filter="url(#grid-cell-shadow)" />
    <rect x="291" y="116" width="92" height="52" rx="8" fill="#eab308" stroke="#a16207" stroke-width="2" filter="url(#grid-cell-shadow)" />
    <text x="288" y="147" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">Bagian 6 (Kuning) = 1/6</text>
  </g>

  <!-- ==================== BOTTOM: SUMMARY BADGE ==================== -->
  <g transform="translate(40, 400)">
    <rect width="680" height="55" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" filter="url(#ivon-card-shadow)" />
    <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="#5b21b6">
      ✨ KESIMPULAN: 12 Kotak dibagi 6 Kelompok = 2 Kotak per Kelompok
    </text>
    <text x="340" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">
      Maka, untuk mewarnai <tspan font-weight="900">1/6</tspan> bagian dari 12 kotak, kamu cukup mewarnai <tspan font-weight="900" fill="#dc2626">2 kotak</tspan>! (karena 1/6 = 2/12)
    </text>
  </g>
</svg>
