<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="100%" height="100%" role="img" aria-labelledby="title desc" style="font-family:'Nunito', 'Aptos', 'Segoe UI', Arial, sans-serif;">
<title id="title">Cara Ivon Menemukan 1/6 dari 12 Kotak</title><desc id="desc">A 12-cell grid is divided into six equal color groups, each containing two cells. The illustration shows that one of six equal groups is two of twelve cells.</desc>
<rect x="1" y="1" width="898" height="568" rx="26" fill="#FFFEFB" stroke="#DCE6EF" stroke-width="2"/>
<text x="450" y="44" font-size="27" font-weight="800" fill="#24364B" text-anchor="middle" >Cara Ivon Menemukan 1/6 dari 12 Kotak</text>
<rect x="32" y="68" width="404" height="116" rx="18" fill="#FFF1F1" stroke="#F4C7C9" stroke-width="1.5"/>
<rect x="52" y="82" width="78" height="28" rx="14.0" fill="#FCE1E2" stroke="#F3C0C4" stroke-width="1.5"/>
<text x="91.0" y="101.1" font-size="15" font-weight="800" fill="#C84B55" text-anchor="middle" >Elsa</text>
<text x="54" y="132" font-size="14" font-weight="600" fill="#24364B" text-anchor="start" >“Soal ini tidak bisa diselesaikan karena</text>
<text x="54" y="153" font-size="14" font-weight="600" fill="#24364B" text-anchor="start" >kotaknya ada 12, bukan 6!”</text>
<rect x="464" y="68" width="404" height="116" rx="18" fill="#EFF9F4" stroke="#C7E9D8" stroke-width="1.5"/>
<rect x="484" y="82" width="78" height="28" rx="14.0" fill="#D8F2E5" stroke="#B8E5D0" stroke-width="1.5"/>
<text x="523.0" y="101.1" font-size="15" font-weight="800" fill="#26865D" text-anchor="middle" >Ivon</text>
<text x="486" y="132" font-size="14" font-weight="600" fill="#24364B" text-anchor="start" >“Bayangkan 12 kotak dibagi untuk 6 orang.</text>
<text x="486" y="153" font-size="14" font-weight="600" fill="#24364B" text-anchor="start" >Setiap kelompok mendapat 2 kotak.”</text>
<text x="450" y="211" font-size="15" font-weight="700" fill="#5D7185" text-anchor="middle" >12 kotak • 6 kelompok sama besar</text>
<rect x="211" y="222" width="105" height="48" rx="10" fill="#F8B85B" stroke="#D98A26" stroke-width="2"/>
<rect x="324" y="222" width="105" height="48" rx="10" fill="#F8B85B" stroke="#D98A26" stroke-width="2"/>
<rect x="453" y="222" width="105" height="48" rx="10" fill="#87C9F3" stroke="#328CCB" stroke-width="2"/>
<rect x="566" y="222" width="105" height="48" rx="10" fill="#87C9F3" stroke="#328CCB" stroke-width="2"/>
<rect x="211" y="279" width="105" height="48" rx="10" fill="#B8C3D2" stroke="#7D8EA2" stroke-width="2"/>
<rect x="324" y="279" width="105" height="48" rx="10" fill="#B8C3D2" stroke="#7D8EA2" stroke-width="2"/>
<rect x="453" y="279" width="105" height="48" rx="10" fill="#8ADBD9" stroke="#32AAA6" stroke-width="2"/>
<rect x="566" y="279" width="105" height="48" rx="10" fill="#8ADBD9" stroke="#32AAA6" stroke-width="2"/>
<rect x="211" y="336" width="105" height="48" rx="10" fill="#9AD9AE" stroke="#45A56A" stroke-width="2"/>
<rect x="324" y="336" width="105" height="48" rx="10" fill="#9AD9AE" stroke="#45A56A" stroke-width="2"/>
<rect x="453" y="336" width="105" height="48" rx="10" fill="#FFE08A" stroke="#D6A12B" stroke-width="2"/>
<rect x="566" y="336" width="105" height="48" rx="10" fill="#FFE08A" stroke="#D6A12B" stroke-width="2"/>
<rect x="72" y="412" width="756" height="128" rx="18" fill="#F4F0FF" stroke="#D7CBFF" stroke-width="1.5"/>
<text x="450" y="439" font-size="16" font-weight="700" fill="#7C65C9" text-anchor="middle" >Setiap kelompok = 2 dari 12 kotak</text>
<text x="450" y="477" font-size="23" font-weight="800" fill="#24364B" text-anchor="middle" >12 ÷ 6 = 2 kotak per kelompok</text>
<text x="450" y="510" font-size="23" font-weight="800" fill="#7C65C9" text-anchor="middle" >Jadi, 1/6 = 2/12</text>
</svg>