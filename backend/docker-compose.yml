services:
  db:
    image: docker.io/postgres:17-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraction_user -d fraction_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/dhanuprys/fraction-backend
    ports:
      - "20220:20291"
    env_file:
      - .env
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:
